name: kayydrive-prod

services:
  migrate:
    image: ${IMAGE_PREFIX:?Definissez IMAGE_PREFIX dans .env}/kayydrive-core-api:${IMAGE_TAG:-latest}
    command:
      [
        "node",
        "node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
      ]
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kayydrive-network
    restart: "no"

  core-api:
    image: ${IMAGE_PREFIX:?Definissez IMAGE_PREFIX dans .env}/kayydrive-core-api:${IMAGE_TAG:-latest}
    ports:
      - "${CORE_API_PORT:-3200}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OSRM_URL=${OSRM_URL:-http://osrm-backend:5000}
      - IA_SERVICE_URL=${IA_SERVICE_URL:-http://ia-service:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:55555}
      - S3_ENDPOINT=${S3_ENDPOINT:-minio}
      - S3_PORT=${S3_PORT:-9000}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-kayydrive}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-http://localhost:9000/kayydrive}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_AUTO_CREATE_BUCKET=${S3_AUTO_CREATE_BUCKET:-true}
      - S3_SET_PUBLIC_POLICY=${S3_SET_PUBLIC_POLICY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - kayydrive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  ia-service:
    image: ${IMAGE_PREFIX:?Definissez IMAGE_PREFIX dans .env}/kayydrive-ia-service:${IMAGE_TAG:-latest}
    ports:
      - "${IA_PORT:-9820}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:55555}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kayydrive-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  osrm-backend:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data:ro
    command: osrm-routed --algorithm mld /data/cameroon-latest.osrm
    networks:
      - kayydrive-network
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kayydrive-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    networks:
      - kayydrive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - kayydrive-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: ["gateway"]
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api
      - ia-service
    networks:
      - kayydrive-network
    restart: unless-stopped

networks:
  kayydrive-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
