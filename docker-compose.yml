services:
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
      target: development
    ports:
      - "4000:3000" # On utilise à nouveau le port 4000 pour Windows
    volumes:
      - ./core-api:/app
      - core-api-node-modules:/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OSRM_URL=${OSRM_URL}
      - IA_SERVICE_URL=${IA_SERVICE_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - kayydrive-network

  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    volumes:
      - ./ia-service/app:/app/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - kayydrive-network

  osrm-backend:
    image: osrm/osrm-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/cameroon-latest.osrm
    networks:
      - kayydrive-network
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3
    container_name: kayydrive-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kayydrive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayydrive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kayydrive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kayydrive-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=True
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - kayydrive-network
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kayydrive-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api
      - ia-service
    networks:
      - kayydrive-network
    restart: unless-stopped

networks:
  kayydrive-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  core-api-node-modules:
  pgadmin-data:
