name: Publish Docker images

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata Core API
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kayydrive-core-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Core API
        uses: docker/build-push-action@v6
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

      - name: Metadata IA Service
        id: meta-ia
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kayydrive-ia-service
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push IA Service
        uses: docker/build-push-action@v6
        with:
          context: ./ia-service
          file: ./ia-service/Dockerfile
          push: true
          tags: ${{ steps.meta-ia.outputs.tags }}
          labels: ${{ steps.meta-ia.outputs.labels }}
          cache-from: type=gha,scope=ia-service
          cache-to: type=gha,mode=max,scope=ia-service
