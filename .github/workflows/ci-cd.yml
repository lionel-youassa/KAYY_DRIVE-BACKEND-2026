name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  WORKING_DIR: ./core-api

jobs:
  # ──────────────────────────────────────────────
  # Étape 1 — Lint & Format
  # ──────────────────────────────────────────────
  lint:
    name: 1. Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Format (Prettier)
        run: npx prettier --check "{src,test}/**/*.ts"

      - name: Lint (ESLint)
        run: npx eslint "{src,test}/**/*.ts"

  # ──────────────────────────────────────────────
  # Étape 2 — Tests unitaires + couverture
  # Dépend de : lint
  # ──────────────────────────────────────────────
  test:
    name: 2. Tests
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: core-api/coverage/
          retention-days: 5

  # ──────────────────────────────────────────────
  # Étape 3 — Build
  # Dépend de : test
  # ──────────────────────────────────────────────
  build:
    name: 3. Build
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # Étape 4 — Docker Build & Push (Docker Hub)
  # Dépend de : build
  # ──────────────────────────────────────────────
  docker:
    name: 4. Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core API
        uses: docker/build-push-action@v6
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kayydrive-core-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kayydrive-core-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Étape 5 — Deploy sur Render
  # Dépend de : docker
  # ──────────────────────────────────────────────
  deploy:
    name: 5. Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "200\|201" \
            && echo "✅ Deploy triggered successfully" \
            || (echo "❌ Deploy trigger failed" && exit 1)
