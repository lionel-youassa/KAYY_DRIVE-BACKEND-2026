name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  WORKING_DIR: ./core-api

jobs:
  # ──────────────────────────────────────────────
  # Étape 1 — Lint & Format
  # ──────────────────────────────────────────────
  lint:
    name: 1. Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Format (Prettier)
        run: npx prettier --check "{src,test}/**/*.ts"

      - name: Lint (ESLint)
        run: npx eslint "{src,test}/**/*.ts"

  # ──────────────────────────────────────────────
  # Étape 2 — Tests unitaires + couverture
  # Dépend de : lint
  # ──────────────────────────────────────────────
  test:
    name: 2. Tests
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: core-api/coverage/
          retention-days: 5

  # ──────────────────────────────────────────────
  # Étape 3 — Build
  # Dépend de : test
  # ──────────────────────────────────────────────
  build:
    name: 3. Build
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # Étape 4 — Publication des images (GHCR)
  # Dépend de : build
  # ──────────────────────────────────────────────
  publish:
    name: 4. Publish Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata Core API
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kayydrive-core-api
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push Core API
        uses: docker/build-push-action@v6
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

      - name: Metadata IA Service
        id: meta-ia
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kayydrive-ia-service
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push IA Service
        uses: docker/build-push-action@v6
        with:
          context: ./ia-service
          file: ./ia-service/Dockerfile
          push: true
          tags: ${{ steps.meta-ia.outputs.tags }}
          labels: ${{ steps.meta-ia.outputs.labels }}
          cache-from: type=gha,scope=ia-service
          cache-to: type=gha,mode=max,scope=ia-service

  # ──────────────────────────────────────────────
  # Étape 5 — Deploy sur Render
  # Dépend de : publish
  # ──────────────────────────────────────────────
  deploy:
    name: 5. Deploy to Render
    runs-on: ubuntu-latest
    needs: [publish]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "200\|201" \
            && echo "Deploy triggered successfully" \
            || (echo "Deploy trigger failed" && exit 1)
