name: CI/CD Pipeline

on:
  push:
    branches: [ Main,develop]
  pull_request:
    branches: [ Main,develop]

env:
  NODE_VERSION: '22'
  WORKING_DIR: ./core-api

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint & Format
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Format (Prettier)
        run: npx prettier --write "{src,test}/**/*.ts"

      - name: Lint (ESLint)
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 500

  # ──────────────────────────────────────────────
  # 2. Tests unitaires + couverture
  # ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: core-api/coverage/
          retention-days: 5

  # ──────────────────────────────────────────────
  # 3. Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # 4. Docker Build & Push (Docker Hub)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core API
        uses: docker/build-push-action@v6
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kayydrive-core-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kayydrive-core-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 5. SonarCloud - Analyse qualité
  # ──────────────────────────────────────────────
  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: core-api/coverage/

      - name: Verify SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::SONAR_TOKEN is empty! Go to Settings > Secrets > Actions and add it."
            exit 1
          fi
          echo "SONAR_TOKEN is set."

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # 5. Deploy sur Render (main uniquement)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build, docker, sonarqube]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !failure() && !cancelled()
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "200\|201" \
            && echo "Deploy triggered successfully" \
            || (echo "Deploy trigger failed" && exit 1)
