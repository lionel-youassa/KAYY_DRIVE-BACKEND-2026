# Blueprint Render 100 % gratuit : uniquement les deux nouveaux services.
# Le backend (core-api), la base PostgreSQL et Redis existent déjà et sont
# gérés à la main dans le tableau de bord : ils ne sont volontairement
# PAS déclarés ici, pour éviter de créer des doublons ou des services payants.
#
# Variables à configurer sur le service core-api (tableau de bord Render) :
#   OSRM_URL=https://kayy-osrm.onrender.com
#   IA_SERVICE_URL=https://kayy-ia.onrender.com
#   CORS_ORIGINS=https://<domaine-du-frontend>   (ou * pour autoriser tous les domaines)
#
# Stockage optionnel (S3 compatible : Cloudflare R2, AWS S3, MinIO...).
# Sans S3_ENDPOINT, le stockage est désactivé et les uploads renvoient 503.
# Cloudflare R2 (recommandé en production) :
#   S3_ENDPOINT=<account-id>.r2.cloudflarestorage.com
#   S3_PORT=443, S3_USE_SSL=true, S3_REGION=auto
#   S3_ACCESS_KEY=..., S3_SECRET_KEY=..., S3_BUCKET=kayydrive
#   S3_PUBLIC_BASE_URL=https://pub-xxxx.r2.dev
#   S3_FORCE_PATH_STYLE=true
#   S3_AUTO_CREATE_BUCKET=false, S3_SET_PUBLIC_POLICY=false
# Compatibilité : les variables MINIO_* restent supportées.

services:
  # ── OSRM (calcul d'itinéraires, carte du Cameroun) ──
  - type: web
    name: kayy-osrm
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./osrm/dockerfile
    dockerContext: ./osrm
    healthCheckPath: /nearest/v1/driving/0,0

  # ── Service IA (FastAPI) ──
  - type: web
    name: kayy-ia
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./ia-service/Dockerfile
    dockerContext: ./ia-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false # à saisir dans le tableau de bord Render