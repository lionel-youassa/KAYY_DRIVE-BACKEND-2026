# Blueprint Render 100 % gratuit : uniquement les deux nouveaux services.
# Le backend (core-api), la base PostgreSQL et Redis existent déjà et sont
# gérés à la main dans le tableau de bord : ils ne sont volontairement
# PAS déclarés ici, pour éviter de créer des doublons ou des services payants.

services:
  # ── OSRM (calcul d'itinéraires, carte du Cameroun) ──
  - type: web
    name: kayy-osrm
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./osrm/dockerfile
    dockerContext: ./osrm
    healthCheckPath: /nearest/v1/driving/0,0

  # ── Service IA (FastAPI) ──
  - type: web
    name: kayy-ia
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./ia-service/Dockerfile
    dockerContext: ./ia-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false # à saisir dans le tableau de bord Render