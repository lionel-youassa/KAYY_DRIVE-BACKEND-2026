# Blueprint Render 100 % gratuit : uniquement les deux nouveaux services.
# Le backend (core-api), la base PostgreSQL et Redis existent déjà et sont
# gérés à la main dans le tableau de bord : ils ne sont volontairement
# PAS déclarés ici, pour éviter de créer des doublons ou des services payants.
#
# Variables à configurer sur le service core-api (tableau de bord Render) :
#   OSRM_URL=https://kayy-osrm.onrender.com
#   IA_SERVICE_URL=https://kayy-ia.onrender.com
#   CORS_ORIGINS=https://<domaine-du-frontend>   (ou * pour autoriser tous les domaines)
#
# Stockage optionnel (MinIO/S3 compatible). Sans MINIO_ENDPOINT, le stockage
# est désactivé et les uploads renvoient 503 :
#   MINIO_ENDPOINT=..., MINIO_PORT=443, MINIO_USE_SSL=true
#   MINIO_ACCESS_KEY=..., MINIO_SECRET_KEY=..., MINIO_BUCKET=kayydrive
#   MINIO_PUBLIC_URL=https://...

services:
  # ── OSRM (calcul d'itinéraires, carte du Cameroun) ──
  - type: web
    name: kayy-osrm
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./osrm/dockerfile
    dockerContext: ./osrm
    healthCheckPath: /nearest/v1/driving/0,0

  # ── Service IA (FastAPI) ──
  - type: web
    name: kayy-ia
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./ia-service/Dockerfile
    dockerContext: ./ia-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false # à saisir dans le tableau de bord Render